}

}

.section{

.section-title{
    text-align:center;

}

    width:60px;

    background:#f2c400;
    margin:10px auto;
    border-radius:5px;
}

/* ABOUT */

.about-text{
    max-width:900px;
    margin:auto;
    text-align:center;
    font-size:17px;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
    margin-top:35px;
}

.card{

    padding:28px;
    border-radius:14px;

    border-top:4px solid #0645ad;
}

.card h3{
    color:#0645ad;
    margin-bottom:8px;
}
